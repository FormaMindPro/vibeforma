name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q -m "not windows"

      - name: Check tag matches VERSION
        run: |
          VERSION=$(python -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('app/config.py').read()).group(1))")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }

      - name: Build release artifact
        run: python tools/build_release.py --out dist

      - name: Verify the artifact layout
        run: |
          python - <<'PY'
          import glob, zipfile
          zip_path = glob.glob("dist/VibeForma-*.zip")[0]
          with zipfile.ZipFile(zip_path) as archive:
              names = set(archive.namelist())
          assert any(n.endswith("/test_ru.wav") for n in names), "test_ru.wav missing"
          assert any(n.endswith("/install.py") for n in names), "install.py missing"
          assert any(n.endswith("/app/main.py") for n in names), "app/main.py missing"
          print("release artifact OK: %d files" % len(names))
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VibeForma-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
