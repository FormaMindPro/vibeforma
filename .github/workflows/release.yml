name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q -m "not windows"

      - name: Build release artifact
        run: python tools/build_release.py --out dist

      - name: Check tag matches VERSION
        run: |
          VERSION=$(python -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('app/config.py').read()).group(1))")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign the manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "MINISIGN_SECRET_KEY is not configured; refusing an unsigned release"
            exit 1
          fi
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          minisign -Sm dist/release-manifest.json -s "$RUNNER_TEMP/minisign.key"
          test -s dist/release-manifest.json.minisig

      - name: Verify the artifact layout
        run: |
          python - <<'PY'
          import json, zipfile
          manifest = json.load(open("dist/release-manifest.json", encoding="utf-8"))
          with zipfile.ZipFile("dist/%s" % manifest["zip"]) as archive:
              names = set(archive.namelist())
          missing = set(manifest["files"]) - names
          assert not missing, "missing: %s" % sorted(missing)[:3]
          assert any(n.endswith("/test_ru.wav") for n in names), "test_ru.wav missing"
          assert any(n.endswith("/install.py") for n in names), "install.py missing"
          print("release artifact OK: %d files" % len(names))
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VibeForma-*.zip
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/release-manifest.json.minisig
          fail_on_unmatched_files: true
